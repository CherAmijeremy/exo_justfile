name: Identité

on:
  push:

jobs:
  nom:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher le nom
        run: 'echo "Nom : ${{ vars.nom }}"'

  prenom:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher le prénom
        run: 'echo "Prénom : ${{ vars.prenom }}"'

  email:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher l'email
        run: 'echo "Email : ${{ vars.email }}"'